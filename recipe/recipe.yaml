schema_version: 1

context:
  version: "1.1.0"

package:
  name: pcodec
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/p/pcodec/pcodec-${{ version }}.tar.gz
    sha256: 71d306ff461d7089fcf578649212afc6f78307b2a78d9c44d819a7eddeb3bfd0
  # the sdist does not ship the license file
  - url: https://raw.githubusercontent.com/pcodec/pcodec/refs/tags/Python_v${{ version }}/LICENSE
    sha256: c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4
    file_name: LICENSE

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.0,<2.0
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - pcodec
        - pcodec.wrapped
      pip_check: true
  - files:
      source:
        - pco_python/test/
    requirements:
      run:
        - pytest
    script:
      # these two tests read pco/assets/, which the sdist does not ship
      - pytest pco_python/test -v -k "not test_simple_decompress_errors and not test_decompress_without_n_hint"

about:
  homepage: https://github.com/pcodec/pcodec
  summary: Lossless codec for numerical data
  description: |
    Pcodec (or pco) losslessly compresses and decompresses numerical sequences
    with high compression ratio and moderately fast speed. This package
    provides the Python bindings.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://pcodec.readthedocs.io/
  repository: https://github.com/pcodec/pcodec

extra:
  recipe-maintainers:
    - Hoeze
